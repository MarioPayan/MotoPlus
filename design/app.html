function openJobsPicker(){showModal('parts-picker',{query:'',zone:'all',selected:[],existing:[...orderDraft().partIds]})}
function PickerRows(m){const query=m.query.trim().toLocaleLowerCase(locale),ps=bike().parts.filter(p=>(m.zone==='all'||p.zone===m.zone)&&(!query||partName(p).toLocaleLowerCase(locale).includes(query))),suggested=ps.filter(p=>['bad','warn'].includes(partState(p).status)).sort((a,b)=>partState(b).used-partState(a).used),rest=ps.filter(p=>!suggested.includes(p)),row=p=>{const existing=m.existing.includes(p.id),selected=existing||m.selected.includes(p.id);return `<button type="button" class="picker-row ${selected?'selected':''}" data-action="picker-select:${p.id}" aria-pressed="${selected}" ${existing?'disabled':''}>${Icon(p.icon,23)}<span class="col grow"><strong>${esc(partName(p))}</strong><span class="hint status-${partState(p).status} status-text">${esc(existing?t('addedToWorkshop'):shortLeft(partState(p)))}</span></span><span class="selection-mark">${selected?Icon('check',16):''}</span></button>`};return (suggested.length?Cap(t('suggestedParts'))+suggested.map(row).join(''):'')+(rest.length?Cap(t('otherParts'))+rest.map(row).join(''):'')||Hint(t('noMatches'))}
function PartsPicker(m){return{title:t('chooseJobs'),bottom:true,content:`<div class="parts-picker"><div class="row">${Icon('search',20)}<div class="grow">${Field('part-search',t('searchParts'),m.query,'search','autocomplete="off"')}</div>${IconBtn('close',t('close'),'dismiss')}</div><div class="zone-filters">${Object.entries({all:t('allZones'),...Object.fromEntries(ZONES.filter(z=>bike().parts.some(p=>p.zone===z)).map(z=>[z,t('zones')[z]]))}).map(([id,label])=>`<button class="choice ${m.zone===id?'selected':''}" type="button" data-action="picker-zone:${id}" aria-pressed="${m.zone===id}">${esc(label)}</button>`).join('')}</div><div id="picker-results" class="picker-results">${PickerRows(m)}</div></div>`,actions:Btn(tr('addSelected',{n:m.selected.length}),'picker-add',false,null,!m.selected.length,'full')}}
function entryRecord(type,id){const b=bike();return type==='fuel'?b.fuel.find(f=>f.id===id):type==='reading'?b.readings[Number(id)]:type==='ride'?b.rides[Number(id)]:type==='order'?b.orders.find(o=>o.id===id):type==='job'?orderJobs(orderDraft()).find(j=>j.id===id):null}
function EntryDetails(m){const r=entryRecord(m.entryType,m.id);if(!r)return{title:t('details'),bottom:true,content:Hint(t('emptyHistory')),actions:TextBtn(t('close'),'dismiss')};const title=m.entryType==='fuel'?t('fillup'):m.entryType==='reading'?t('reading'):m.entryType==='ride'?t('rideLabel'):m.entryType==='order'?t('workOrder')+' · '+tr('orderNumber',{n:r.number}):r.name;let content=m.entryType==='job'?Icon(r.icon,30)+(r.note?Hint(r.note):''):(r.date?Hint(prettyDate(r.date)):'')+(r.km!==undefined?`<strong class="mono" style="font-size:24px">${fmt(r.km)} ${esc(t('kmLower'))}</strong>`:'');if(m.entryType==='fuel')content+=Hint(r.liters.toLocaleString(locale)+' L')+(r.total!==null?Hint(money(r.total)):'')+Hint(r.full?t('fullTank'):t('csvPartial'));if(m.entryType==='reading'){m.value??=String(r.km);content=Hint(prettyDate(r.date))+Field('detail-reading',t('odoKm'),m.value,'number','min="0" max="9999999"');if(bike().readings.length===1)content+=Hint(t('lastReadingRequired'))}if(m.entryType==='order')content+=orderJobs(r).map(j=>`<div class="event-row">${Icon(j.icon,20)}<div class="col">${esc(j.name)}${j.note?Hint(j.note):''}</div></div>`).join('')+(r.notes?Hint(r.notes):'');return{title,bottom:true,content:content+((m.entryType!=='reading'||bike().readings.length>1)?TextBtn(t('delete'),'ask-delete-entry','danger'):''),actions:TextBtn(t('close'),'dismiss')+(m.entryType==='reading'?TextBtn(t('save'),'save-detail-reading'):m.entryType==='order'&&!r.closed?TextBtn(t('edit'),'edit-order'):'')}}
function askDelete(target,name){const parent=state.modal;showModal('delete-check',{target,name,parent})}
function deleteTarget(d){const b=bike();switch(d.type){case'record':{const r=b.history.find(r=>r.id===d.id);b.history=b.history.filter(r=>r.id!==d.id);if(r)recompute(r.partId);break}case'fuel':b.fuel=b.fuel.filter(f=>f.id!==d.id);break;case'reading':if(b.readings.length>1){const r=b.readings[Number(d.id)];b.readings=b.readings.filter(x=>x!==r)}break;case'ride':b.rides.splice(Number(d.id),1);break;case'doc':garage.documents=garage.documents.filter(x=>x.id!==d.id);state.draft=null;break;case'job':{const o=orderDraft();o.partIds=o.partIds.filter(id=>id!==d.id);o.customItems=o.customItems.filter(j=>j.id!==d.id);delete o.itemNotes[d.id];saveOrder();break}case'order':b.orders=b.orders.filter(o=>o.id!==d.id);state.orderDraft=null;state.returnDraft=null;state.returnDone=null;break;case'part':{const p=b.parts.find(p=>p.id===d.id);for(const r of b.history)if(r.partId===d.id)r.partName??=partName(p);b.parts=b.parts.filter(p=>p.id!==d.id);for(const o of b.orders)o.partIds=o.partIds.filter(id=>id!==d.id);state.orderDraft=null;state.partId=b.parts[0]?.id||'';state.limitDraft=null;break}case'bike':garage.bikes=garage.bikes.filter(b=>b.id!==d.id);garage.documents=garage.documents.filter(x=>x.bikeId!==d.id);garage.selectedId=garage.bikes[0]?.id||null;state.draft=null;state.orderDraft=null;state.form={};break}}
function round4Modal(m){if(m.type==='parts-picker')return PartsPicker(m);if(m.type==='entry-details')return EntryDetails(m);if(m.type==='paper-reminder')return{title:docLabel(m.docType),bottom:true,content:Field('reminder-number',t('anticipation'),m.value,'number',`min="0" max="${m.unit==='m'?36:1095}" step="1"`)+ChoiceRow({d:t('days'),m:t('months')},m.unit,'reminder-unit'),actions:TextBtn(t('cancel'),'dismiss')+`<button type="button" class="text-btn" data-action="save-paper-reminder" ${validReminder(m)?'':'disabled'}>${esc(t('save'))}</button>`};if(m.type==='delete-check')return{title:tr('deleteQuestion',{name:m.name}),bottom:true,content:Hint(t('deleteWarning')),actions:TextBtn(t('cancel'),'delete-cancel')+TextBtn(t('delete'),'delete-apply','danger')};if(m.type==='incoming-ai')return{title:t('androidShare'),bottom:true,content:Hint(t('demoReportSummary'))+MenuItem('bike',t('app'),'receive-ai-apply'),actions:TextBtn(t('cancel'),'dismiss')};return null}
async function round4Action(key,arg){switch(key){case'pick-jobs':openJobsPicker();return true;case'picker-zone':state.modal.zone=arg;renderModal();document.querySelector('.picker-results')?.scrollTo(0,0);return true;case'picker-select':{const m=state.modal;if(!m||m.existing.includes(arg))return true;m.selected=m.selected.includes(arg)?m.selected.filter(id=>id!==arg):[...m.selected,arg];renderModal();return true}case'picker-add':{const d=orderDraft();d.partIds=[...new Set([...d.partIds,...state.modal.selected])];saveOrder();closeModal(false);render();return true}case'job-note':state.noteOpen=[...new Set([...(state.noteOpen||[]),arg])];render();document.getElementById('job-note-'+arg)?.focus();return true;case'order-note':state.orderNoteOpen=true;render();document.getElementById('order-notes')?.focus();return true;case'job-details':showModal('entry-details',{entryType:'job',id:arg});return true;case'order-details':{const o=saveOrder();if(o)showModal('entry-details',{entryType:'order',id:o.id});return true}case'entry':{const [entryType,...id]=arg.split(':');showModal('entry-details',{entryType,id:id.join(':')});return true}case'edit-order':closeModal(false);nav('order');return true;case'paper-reminder':{const d=reminderValue(arg);showModal('paper-reminder',{docType:arg,value:String(d.value),unit:d.unit});return true}case'reminder-unit':state.modal.unit=arg;renderModal();return true;case'save-paper-reminder':{const m=state.modal;if(!validReminder(m))return true;(garage.paperReminderUnits??={})[m.docType]={value:Number(m.value),unit:m.unit};garage.paperReminders[m.docType]=Number(m.value)*(m.unit==='m'?30:1);closeModal(false);render();snack(t('reminderSaved'));return true}case'receive-ai':showModal('incoming-ai');return true;case'receive-ai-apply':state.reportAnswer=JSON.stringify({v:2,title:t('demoReportTitle'),urgency:'medium',summary:t('demoReportSummary'),causes:[{cause:t('demoCause'),likelihood:'high',zone:'drivetrain'}],checks:[t('demoCheck')],advice:t('demoAdvice')},null,2);state.reportError=null;closeModal(false);render();snack(t('aiReceived'));return true;case'save-detail-reading':{const m=state.modal;if(!validDetailReading(m))return true;const r=entryRecord('reading',m.id);if(r)r.km=Number(m.value);state.form.reading=undefined;closeModal(false);render();snack(t('readingCorrected'));return true}case'ask-delete-entry':{const m=state.modal,r=entryRecord(m.entryType,m.id);if(r)askDelete({type:m.entryType,id:m.id},m.entryType==='job'?r.name:m.entryType==='fuel'?t('fillup'):m.entryType==='reading'?t('reading'):m.entryType==='ride'?t('rideLabel'):t('workOrder'));return true}case'ask-delete-record':askDelete({type:'record',id:state.modal.draft.id},recordName(state.modal.draft));return true;case'ask-delete-doc':askDelete({type:'doc',id:state.draft.id},docName(state.draft));return true;case'ask-delete-bike':{const b=garage.bikes.find(b=>b.id===state.modal.bikeId);askDelete({type:'bike',id:b.id},bikeTitle(b));return true}case'ask-delete-part':askDelete({type:'part',id:arg},partName(part(arg)));return true;case'delete-cancel':if(state.modal.parent){state.modal=state.modal.parent;renderModal();document.querySelector('.dialog')?.focus()}else closeModal();return true;case'delete-apply':{if(state.modal?.type!=='delete-check')return true;const target=state.modal.target;deleteTarget(target);closeModal(false);if(target.type==='doc'&&state.screen==='doc')nav('papers');else if(target.type==='bike')nav(garage.bikes.length?'home':'add-bike');else if(target.type==='part'&&['limit','part'].includes(state.screen))nav('parts');else render();snack(t('deleted'));return true}case'delete-record':case'delete-fuel':case'delete-doc':case'delete-bike':case'remove-job':case'confirm-delete-bike':return true;default:return false}}

// Last-screen convenience only; prototype garage data stays in memory and can be exported as a ZIP.
if(!location.hash){try{const last=localStorage.getItem('motoplus-last-screen');if(last)history.replaceState(null,'','#'+last)}catch{}}
readHash();render();
document.fonts?.ready.then(layoutPlates);
</script>
