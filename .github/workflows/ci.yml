name: CI
on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v4
      - name: Android platform 37
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-37.0" "build-tools;36.0.0" > /dev/null
      - name: Unit tests and debug build
        run: ./gradlew :core:test :app:testDebugUnitTest :app:assembleDebug
      - name: Signed release bundle
        if: ${{ github.ref == 'refs/heads/main' && env.KEYSTORE_B64 != '' }}
        env:
          KEYSTORE_B64: ${{ secrets.KEYSTORE_B64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
        run: |
          echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/upload.jks"
          printf 'storeFile=%s\nstorePassword=%s\nkeyAlias=upload\nkeyPassword=%s\n' "$RUNNER_TEMP/upload.jks" "$KEYSTORE_PASSWORD" "$KEYSTORE_PASSWORD" > "$RUNNER_TEMP/keystore.properties"
          MOTOPLUS_KEYSTORE_PROPERTIES="$RUNNER_TEMP/keystore.properties" ./gradlew :app:bundleRelease
      - uses: actions/upload-artifact@v4
        with:
          name: motoplus
          path: |
            app/build/outputs/apk/debug/app-debug.apk
            app/build/outputs/bundle/release/*.aab
          if-no-files-found: ignore
