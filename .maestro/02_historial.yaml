appId: com.kaze.motoplus
name: Registrar un mantenimiento con coste y verlo en el historial
---
- launchApp
- tapOn: "Aceite de motor"
- tapOn: "Registrar con fecha, coste o factura"
- tapOn: "Coste (opcional)"
- inputText: "120"
- tapOn: "Guardar"
- assertVisible: "Gastado:.*"
- back
- tapOn: "MI MOTO"
- tapOn: "Historial y gastos"
- assertVisible: "GASTADO EN .*"
- back
